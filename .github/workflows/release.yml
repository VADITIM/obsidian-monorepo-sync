name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

# One release at a time, so two quick pushes never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: version
        run: echo "version=$(node version-bump.mjs)" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Commit version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Vadim Niedental"
          git config user.email "136070587+VADITIM@users.noreply.github.com"
          git diff --quiet || git commit -am "Release $VERSION [skip ci]"
          git tag "$VERSION"
          git push origin HEAD:master "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" main.js manifest.json --title "$VERSION" --generate-notes
